<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SHOCK · KIOSK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   SHOCK · KIOSK · v6 · LIGHT-ONLY
   Sin modo noche. Paleta papel-de-lab: blanco cremoso dominante,
   tinta negra cálida, hairlines suaves. Todos los contrastes
   verificados ≥ 4.5:1 (texto principal) y ≥ 3:1 (texto secundario).
   ================================================================ */
:root {
  /* Surfaces */
  --bg:           #faf9f5;   /* warm paper white */
  --bg-elev:      #f0eee9;   /* slightly darker for cards/hover */
  --bg-deep:      #e8e5dd;   /* deeper for emphasis */

  /* Ink */
  --fg:           #0a0807;   /* warm black ink (contrast 17:1 on bg) */
  --fg-soft:      #3a3733;   /* darker than before — contrast 11:1 */
  --fg-dim:       #6e6960;   /* contrast 5.4:1 — readable for meta */
  --fg-faint:     #a8a29a;   /* contrast 2.4:1 — only decorative */

  /* Lines */
  --hairline:     #c9c4ba;   /* visible hairlines on light bg */
  --hairline-soft:#dcd7cc;   /* secondary hairlines */
  --hairline-strong:#0a0807; /* strong borders (e.g. total separator) */

  /* Accent — dark inverts the visual hierarchy: primary buttons read black */
  --accent:       #0a0807;
  --accent-glow:  rgba(10,8,7,.35);

  /* Chromatic aberration (only on order code now — climax moment) */
  --ca-r:         #d4002e;
  --ca-c:         #00a8cc;

  /* Type stack */
  --display: 'Quantico', 'Space Grotesk', system-ui, sans-serif;
  --body:    'Inter', system-ui, sans-serif;
  --mono:    'JetBrains Mono', ui-monospace, monospace;

  --ease: cubic-bezier(.16, 1, .3, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  cursor: default;
}
button { font-family: inherit; cursor: pointer; }

/* ==== Atmosphere overlays — ajustados para fondo claro ============ */
.grain {
  position: fixed; inset: 0; pointer-events: none; z-index: 99;
  opacity: .045;
  mix-blend-mode: multiply; /* dark grain on light bg */
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 98;
  background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.022) 2px 3px);
}
.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 97;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.06) 100%);
}

/* ==== App shell — container query host ========================= */
.app {
  position: fixed; inset: 0;
  display: grid;
  grid-template-rows: auto 1fr;
  z-index: 1;
  container-type: size;
  container-name: kiosk;
}

/* ==== Top chrome ============================================== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: clamp(10px, 1.6cqi, 18px) clamp(16px, 3cqi, 40px);
  border-bottom: 1px solid var(--hairline);
  font-family: var(--mono);
  font-size: clamp(10px, 1.4cqi, 13px);
  letter-spacing: .15em;
  color: var(--fg-dim);
  text-transform: uppercase;
  flex-shrink: 0;
  background: var(--bg);
}
.logo {
  height: clamp(24px, 3.2cqi, 36px);
  width: auto;
  /* Logo source es blanco-sobre-transparente. Invertimos para que se lea negro sobre crema. */
  filter: invert(1) brightness(.92) contrast(1.15);
  display: block;
}
.topbar-right { display: flex; align-items: center; gap: clamp(10px, 1.6cqi, 20px); }
.clock {
  font-variant-numeric: tabular-nums;
  color: var(--fg-soft);
}

/* ==== Main stage ============================================== */
main { position: relative; overflow: hidden; display: flex; min-height: 0; }
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: clamp(16px, 3cqi, 40px);
  opacity: 0; pointer-events: none;
  transition: opacity .4s var(--ease);
  min-height: 0;
}
.screen.is-active { opacity: 1; pointer-events: auto; }
.screen.is-active .rise { animation: rise .55s var(--ease) forwards; }
@keyframes rise {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ==== Question header ========================================= */
.q-head {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: clamp(12px, 2cqi, 24px);
  gap: 16px;
  flex-shrink: 0;
}
.q-text {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(18px, 2.8cqi, 32px);
  text-transform: uppercase;
  letter-spacing: -.005em;
  line-height: 1.05;
  min-width: 0;
  color: var(--fg);
}
.q-progress { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.q-progress .dot {
  width: clamp(20px, 2.4cqi, 32px); height: 2px;
  background: var(--hairline);
  transition: background .3s;
}
.q-progress .dot.is-done { background: var(--fg); }

/* ==== TILES grid ============================================== */
.tiles {
  flex: 1;
  display: grid;
  gap: clamp(8px, 1.4cqi, 14px);
  min-height: 0; min-width: 0;
}
.tiles.cols-4-2 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
.tiles.cols-4-1 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }

@container kiosk (max-aspect-ratio: 0.85) {
  .tiles.cols-4-2 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
  .tiles.cols-4-1 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
}

/* ==== TILE ==================================================== */
.tile {
  position: relative;
  background: transparent;
  border: 1px solid var(--hairline);
  color: var(--fg);
  font-family: var(--display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: -.01em;
  padding: clamp(14px, 6cqi, 32px);
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: clamp(8px, 4cqi, 20px);
  text-align: left;
  transition: background .25s var(--ease), border-color .25s var(--ease), transform .15s ease;
  min-height: 0; min-width: 0;
  overflow: hidden;
  line-height: .95;
  container-type: inline-size;
}
.tile:hover {
  background: var(--bg-elev);
  border-color: var(--fg-soft);
}
.tile:active { transform: scale(.98); }
.tile.is-selected {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
.tile.is-tapped { animation: tapFlash .25s var(--ease); }
@keyframes tapFlash { 0% { transform: scale(.98); } 100% { transform: scale(1); } }
.tile-label {
  font-size: 18px; /* JS fitText() reescala */
  white-space: nowrap;
  overflow: hidden;
  flex: 1; min-width: 0;
  display: block;
  line-height: 1;
}
.tile-arrow {
  font-family: var(--mono);
  font-weight: 400;
  font-size: clamp(14px, 8cqi, 24px);
  color: var(--fg-dim);
  flex-shrink: 0;
  transition: color .2s;
}
.tile:hover .tile-arrow { color: var(--fg); }
.tile.is-selected .tile-arrow { color: var(--bg); opacity: .8; }

/* ==== HOME tiles ============================================== */
.home-tiles {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr;
  gap: clamp(8px, 1.4cqi, 16px);
  min-height: 0; min-width: 0;
}
@container kiosk (max-aspect-ratio: 0.85) {
  .home-tiles { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
}
.home-tile {
  position: relative;
  background: transparent;
  border: 1px solid var(--hairline);
  color: var(--fg);
  font-family: var(--display);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: -.015em;
  padding: clamp(20px, 4cqi, 56px);
  display: flex; flex-direction: column; justify-content: space-between;
  text-align: left;
  line-height: .9;
  transition: background .3s var(--ease), border-color .3s, color .3s, transform .15s ease;
  overflow: hidden;
  min-height: 0; min-width: 0;
  container-type: inline-size;
}
.home-tile:hover {
  background: var(--bg-elev);
  border-color: var(--fg-soft);
}
.home-tile:active { transform: scale(.99); }
.home-tile.is-tapped { animation: tapFlash .25s var(--ease); }
.home-tile.is-primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}
.home-tile.is-primary:hover {
  background: var(--fg);
  border-color: var(--fg);
}
.home-tile-label {
  font-size: 32px; /* JS fitText() reescala */
  white-space: nowrap;
  overflow: hidden;
  display: block;
  line-height: 1;
}
.home-tile-foot {
  display: flex; justify-content: space-between; align-items: flex-end;
  font-family: var(--mono);
  font-size: clamp(11px, 2cqi, 16px);
  letter-spacing: .2em;
  font-weight: 400;
  text-transform: uppercase;
  color: var(--fg-dim);
  flex-shrink: 0;
}
.home-tile.is-primary .home-tile-foot { color: var(--bg); opacity: .65; }
.home-tile-arrow {
  font-family: var(--mono);
  font-weight: 400;
  font-size: clamp(20px, 3.5cqi, 40px);
  color: var(--fg-dim);
}
.home-tile.is-primary .home-tile-arrow { color: var(--bg); opacity: 1; }

/* ==== Q-foot ================================================== */
.q-foot {
  padding-top: clamp(12px, 2cqi, 24px);
  display: flex; justify-content: flex-start;
  flex-shrink: 0;
}
.back-btn {
  background: transparent; border: none;
  color: var(--fg-soft);
  font-family: var(--mono);
  font-size: clamp(11px, 1.6cqi, 14px);
  letter-spacing: .25em;
  text-transform: uppercase;
  padding: 14px 0;
  display: inline-flex; align-items: center; gap: 12px;
  transition: color .25s;
  min-height: 44px;
}
.back-btn:hover { color: var(--fg); }

/* ==== RESULT screen ============================================ */
.result {
  flex: 1;
  display: flex; flex-direction: column;
  gap: clamp(10px, 1.4cqi, 18px);
  min-height: 0;
}
.result-head {
  display: flex; align-items: baseline; gap: 12px;
  flex-shrink: 0;
}
.result-eyebrow {
  font-family: var(--mono);
  font-size: clamp(10px, 1.3cqi, 13px);
  letter-spacing: .35em;
  color: var(--fg-soft);
  text-transform: uppercase;
}
.result-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(16px, 2.2cqi, 26px);
  line-height: 1;
  letter-spacing: -.005em;
  text-transform: uppercase;
  color: var(--fg);
}

.combo {
  display: flex; flex-direction: column;
  border-top: 1px solid var(--hairline);
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
.combo-item {
  display: grid;
  grid-template-columns: clamp(36px, 4cqi, 52px) 1fr auto;
  gap: clamp(12px, 2cqi, 24px);
  padding: clamp(10px, 1.6cqi, 18px) 0;
  border-bottom: 1px solid var(--hairline-soft);
  align-items: center;
}
.combo-item:last-child { border-bottom: none; }
.ci-code {
  font-family: var(--mono);
  font-size: clamp(11px, 1.5cqi, 15px);
  letter-spacing: .15em;
  color: var(--fg-soft);
  font-weight: 500;
}
.ci-name {
  font-family: var(--display);
  font-weight: 700;
  font-size: 22px;  /* JS fitText() reescala */
  text-transform: uppercase;
  letter-spacing: -.005em;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  display: block;
  color: var(--fg);
}
.ci-meta {
  font-family: var(--mono);
  font-size: clamp(10px, 1.2cqi, 13px);
  color: var(--fg-dim);
  letter-spacing: .04em;
  margin-top: 6px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ci-price {
  font-family: var(--mono);
  font-weight: 500;
  font-size: clamp(18px, 2.6cqi, 32px);
  color: var(--fg);
  letter-spacing: -.01em;
  white-space: nowrap;
}

/* total */
.combo-total {
  display: flex; justify-content: space-between; align-items: baseline;
  border-top: 2px solid var(--hairline-strong);
  padding-top: clamp(12px, 1.8cqi, 20px);
  flex-shrink: 0;
}
.ct-label {
  font-family: var(--mono);
  font-size: clamp(13px, 1.8cqi, 18px);
  letter-spacing: .3em;
  color: var(--fg);
  text-transform: uppercase;
  font-weight: 500;
}
.ct-amount {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(36px, 5.5cqi, 80px);
  letter-spacing: -.02em;
  color: var(--fg);
  line-height: 1;
}

/* confirm */
.confirm-btn {
  background: var(--accent);
  color: var(--bg);
  border: none;
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(20px, 2.6cqi, 32px);
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: clamp(18px, 2.4cqi, 32px) clamp(20px, 2.6cqi, 36px);
  display: flex; justify-content: space-between; align-items: center;
  width: 100%;
  min-height: clamp(64px, 8.5cqi, 100px);
  transition: background .25s, transform .15s ease;
  flex-shrink: 0;
}
.confirm-btn:hover { background: var(--fg-soft); }
.confirm-btn:active { transform: scale(.99); }
.confirm-btn .arrow {
  font-family: var(--mono);
  font-weight: 400;
  font-size: clamp(22px, 2.6cqi, 36px);
}
.result-foot {
  display: flex; justify-content: center;
  flex-shrink: 0;
}

/* ==== ORDER CODE ============================================== */
.order {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  gap: clamp(16px, 3cqi, 36px);
}
.order-label {
  font-family: var(--mono);
  font-size: clamp(11px, 1.6cqi, 16px);
  letter-spacing: .55em;
  color: var(--fg-soft);
  text-transform: uppercase;
}
.order-code {
  font-family: var(--mono);
  font-weight: 700;
  font-size: clamp(120px, 28cqi, 360px);
  line-height: .9;
  letter-spacing: -.05em;
  position: relative;
  display: inline-block;
  color: var(--fg);
  padding: 0 .1em;
}
.order-code::before, .order-code::after {
  content: attr(data-text);
  position: absolute; inset: 0;
  pointer-events: none;
  mix-blend-mode: multiply;
}
.order-code::before {
  color: var(--ca-r);
  animation: ca-r 2.4s ease-in-out infinite;
}
.order-code::after  {
  color: var(--ca-c);
  animation: ca-c 2.4s ease-in-out infinite;
}
@keyframes ca-r {
  0%, 80%, 100% { opacity: .55; transform: translate(-3px, 0); }
  85% { opacity: .9; transform: translate(-12px, 4px); }
  88% { opacity: .55; transform: translate(-3px, 0); }
}
@keyframes ca-c {
  0%, 80%, 100% { opacity: .45; transform: translate(3px, 0); }
  85% { opacity: .8; transform: translate(12px, -4px); }
  88% { opacity: .45; transform: translate(3px, 0); }
}
.order-instr {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(20px, 3cqi, 40px);
  text-transform: uppercase;
  letter-spacing: -.005em;
  max-width: 22ch;
  line-height: 1.05;
  color: var(--fg);
}
.order-meta {
  font-family: var(--mono);
  font-size: clamp(11px, 1.4cqi, 14px);
  letter-spacing: .25em;
  color: var(--fg-soft);
  text-transform: uppercase;
  margin-top: clamp(8px, 1.4cqi, 16px);
}

/* ==== MENU placeholder ======================================== */
.menu-placeholder {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: clamp(20px, 2.5cqi, 32px);
  text-align: center;
}
.menu-placeholder h2 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(40px, 6cqi, 80px);
  letter-spacing: -.025em;
  text-transform: uppercase;
  color: var(--fg);
}
.menu-placeholder p {
  font-family: var(--mono);
  font-size: clamp(11px, 1.6cqi, 14px);
  letter-spacing: .25em;
  color: var(--fg-dim);
  text-transform: uppercase;
  max-width: 30ch;
  line-height: 1.6;
}

/* ==== Idle warning — fondo crema con blur ===================== */
.idle-warning {
  position: fixed; inset: 0; z-index: 200;
  display: none;
  background: rgba(250,249,245,.94);
  backdrop-filter: blur(10px);
  align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
  text-align: center; padding: 40px;
}
.idle-warning.show { display: flex; }
.idle-warning h2 {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(36px, 5vw, 64px);
  text-transform: uppercase; letter-spacing: -.02em;
  color: var(--fg);
}
.idle-warning p {
  font-family: var(--mono); font-size: clamp(11px, 1.1vw, 13px);
  letter-spacing: .25em; color: var(--fg-soft); text-transform: uppercase;
}
.idle-warning button {
  background: var(--accent); color: var(--bg); border: none;
  font-family: var(--display); font-weight: 700;
  font-size: clamp(14px, 1.4vw, 18px); letter-spacing: .25em;
  text-transform: uppercase; padding: 20px 40px; min-height: 60px; margin-top: 12px;
  cursor: pointer;
}
.idle-warning button:hover { background: var(--fg-soft); }

/* ==== Preview mode ============================================ */
body[data-preview] {
  background: #1a1815 !important;
  display: grid; place-items: center; overflow: hidden;
}
body[data-preview] .grain, body[data-preview] .scanlines, body[data-preview] .vignette { display: none; }
body[data-preview] .app {
  position: relative !important; inset: auto !important;
  border: 1px solid #2a2a2a; box-shadow: 0 0 80px rgba(0,0,0,.6);
  overflow: hidden;
}
body[data-preview="9-16"] .app  { aspect-ratio: 9 / 16;   height: 92vh; width: auto; max-width: 92vw; }
body[data-preview="16-9"] .app  { aspect-ratio: 16 / 9;   width: 92vw;  height: auto; max-height: 92vh; }
body[data-preview="9-19"] .app  { aspect-ratio: 9 / 19.5; height: 92vh; width: auto; max-width: 92vw; }
body[data-preview="3-4"]  .app  { aspect-ratio: 3 / 4;    height: 92vh; width: auto; max-width: 92vw; }
body[data-preview] .preview-tag {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  font-family: var(--mono); font-size: 11px; letter-spacing: .25em;
  color: #888; text-transform: uppercase; z-index: 1000;
  background: rgba(0,0,0,.85); padding: 6px 14px; border: 1px solid #2a2a2a;
}
</style>
</head>
<body>

<div class="grain"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<div class="app">

  <header class="topbar">
    <img class="logo" src="https://acdn-us.mitiendanube.com/stores/003/104/793/themes/common/logo-1702573383-1683748864-96f5d266512f581b76e3211392a287351683748864-640-0.png" alt="SHOCK">
    <div class="topbar-right">
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>

  <main id="stage">

    <!-- HOME -->
    <section class="screen is-active" data-screen="home">
      <div class="home-tiles rise">
        <button class="home-tile" data-action="menu">
          <span class="home-tile-foot"><span>01 / Tradicional</span></span>
          <span class="home-tile-label">Ver menú</span>
          <span class="home-tile-foot"><span>Carta completa</span><span class="home-tile-arrow">→</span></span>
        </button>
        <button class="home-tile is-primary" data-action="ai">
          <span class="home-tile-foot"><span>02 / Recomendado</span></span>
          <span class="home-tile-label">Recomendame</span>
          <span class="home-tile-foot"><span>4 preguntas · 30 segundos</span><span class="home-tile-arrow">→</span></span>
        </button>
      </div>
    </section>

    <!-- Q1 · ACTIVIDAD -->
    <section class="screen" data-screen="actividad">
      <div class="q-head rise">
        <h2 class="q-text">¿Qué vas a hacer?</h2>
        <div class="q-progress">
          <span class="dot is-done"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
      <div class="tiles cols-4-2 rise" data-options="actividad">
        <button class="tile" data-value="deep-work"><span class="tile-label">Deep Work</span><span class="tile-arrow">→</span></button>
        <button class="tile" data-value="fuerza"><span class="tile-label">Fuerza</span><span class="tile-arrow">→</span></button>
        <button class="tile" data-value="cardio"><span class="tile-label">Cardio</span><span class="tile-arrow">→</span></button>
        <button class="tile" data-value="hiit"><span class="tile-label">HIIT</span><span class="tile-arrow">→</span></button>
        <button class="tile" data-value="estudio"><span class="tile-label">Estudio</span><span class="tile-arrow">→</span></button>
        <button class="tile" data-value="turno-nocturno"><span class="tile-label">Turno Nocturno</span><span class="tile-arrow">→</span></button>
        <button class="tile" data-value="conduccion"><span class="tile-label">Conducción</span><span class="tile-arrow">→</span></button>
        <button class="tile" data-value="sin-sueno"><span class="tile-label">Sin Sueño</span><span class="tile-arrow">→</span></button>
      </div>
      <div class="q-foot"><button class="back-btn" data-back>← Atrás</button></div>

    <!-- Q2 · TIEMPO -->
    <section class="screen" data-screen="tiempo">
      <div class="q-head rise">
        <h2 class="q-text">¿Por cuánto tiempo?</h2>
        <div class="q-progress">

      </div>
      <div class="tiles cols-4-1 rise" data-options="tiempo">

        <button class="tile" data-value="120"><span class="tile-label">2 horas</span><span class="tile-arrow">→</span></button>
        <button class="tile" data-value="180"><span class="tile-label">3+ horas</span><span class="tile-arrow">→</span></button>

    <section class="screen" data-screen="peso">

          <span class="dot is-done"></span><span class="dot is-done"></span><span class="dot is-done"></span><span class="dot"></span>

      <div class="tiles cols-4-1 rise" data-options="peso">

        <button class="tile" data-value="100"><span class="tile-label">90+ kg</span><span class="tile-arrow">→</span></button>

      <div class="q-foot"><button class="back-btn" data-back>← Atrás</button></div>

    <!-- Q4 · TOLERANCIA -->
    <section class="screen" data-screen="tolerancia">
      <div class="q-head rise">
        <h2 class="q-text">¿Cuánto café tomás?</h2>
        <div class="q-progress">
          <span class="dot is-done"></span><span class="dot is-done"></span><span class="dot is-done"></span><span class="dot is-done"></span>

      <div class="tiles cols-4-1 rise" data-options="tolerancia">

        <button class="tile" data-value="3+"><span class="tile-label">3+ / día</span><span class="tile-arrow">→</span></button>

    <!-- RESULT -->
    <section class="screen" data-screen="result">
      <div class="result rise">
        <div class="result-head">
          <span class="result-eyebrow">Tu combo —</span>
          <h2 class="result-title" id="resultTitle">Modo Físico</h2>
        </div>
        <div class="combo" id="comboItems"></div>
        <div class="combo-total">
          <span class="ct-label">Total</span>
          <span class="ct-amount" id="comboTotal">$ 0</span>
        </div>
        <button class="confirm-btn" data-confirm>
          <span>Confirmar pedido</span>

    <!-- ORDER -->
    <section class="screen" data-screen="order">
      <div class="order rise">
        <span class="order-label">Pedido confirmado</span>
        <span class="order-code" id="orderCode" data-text="A47">A47</span>
        <h2 class="order-instr">Decí este código en mostrador</h2>
        <span class="order-meta">Vuelve solo en <span id="orderCountdown">10</span>s</span>
      </div>
    </section>

    <!-- MENU placeholder -->
    <section class="screen" data-screen="menu">
      <div class="menu-placeholder rise">
        <h2>Menú completo</h2>
        <p>Placeholder · Carta tradicional acá</p>

      </div>

  </main>

</div>

<div class="idle-warning" id="idleWarning">
  <h2>¿Seguís ahí?</h2>
  <p>Volvemos al inicio en <span id="idleCount">10</span>s</p>
  <button id="idleStay">Seguir</button>
</div>

<script>
const PRODUCTS = {
  C1: { code:'C1', name:'Shock Coffee',          meta:'300mg cafeína · double shot',    price:3500, mg:300 },
  C2: { code:'C2', name:'Shock Pre-Entreno',     meta:'+ Creatina · electrolitos',      price:4900, mg:300 },
  C3: { code:'C3', name:'Shock Productividad',   meta:'+ Tirosina · Alpha GPC',         price:4900, mg:300 },
  B1: { code:'B1', name:'+ Concentración',       meta:'Rhodiola · MCT · Carnitina',     price:1699 },
  B2: { code:'B2', name:'+ Energía',             meta:'Taurina · Betaina · Citrulina',  price:1699 },
  B3: { code:'B3', name:'+ Recuperación',        meta:'Colágeno · Magnesio · Vit. C',   price:1699 },
  F1: { code:'F1', name:'Mix de Nueces',         meta:'Almendras · cacao 80%',          price:2999 },
  F2: { code:'F2', name:'Barra Proteína',        meta:'12g proteína + colágeno',        price:2899 },
  F3: { code:'F3', name:'Jerky',                 meta:'Carne deshidratada',             price:3499 },
  F4: { code:'F4', name:'Trufas',                meta:'Chocolate 80% · densas',         price:1999 },
};

function recommend({ actividad, tiempo, peso, tolerancia }) {
  const t = parseInt(tiempo, 10);
  let cafe, booster, comida, title, climax;
  switch (actividad) {
    case 'deep-work':
      cafe='C3'; booster='B1'; comida='F1';
      title='Foco'; climax='Profundo'; break;
    case 'fuerza':
      cafe='C2'; booster='B2'; comida='F2';
      title='Modo'; climax='Fuerza'; break;
    case 'cardio':
      cafe='C2'; booster='B2'; comida='F3';
      title='Modo'; climax='Cardio'; break;
    case 'hiit':
      cafe='C2'; booster='B2'; comida='F2';
      title='Modo'; climax='HIIT'; break;
    case 'estudio':
      cafe='C3'; booster='B1'; comida='F4';
      title='Modo'; climax='Estudio'; break;
    case 'turno-nocturno':
      cafe='C1'; booster='B2'; comida='F3';
      title='Turno'; climax='Nocturno'; break;
    case 'conduccion':
      cafe='C3'; booster='B1'; comida='F3';
      title='Modo'; climax='Alerta'; break;
    case 'sin-sueno':
      cafe='C1'; booster='B2'; comida='F1';
      title='Sin'; climax='Sueño'; break;
    default:
      cafe='C1'; booster='B2'; comida='F4';
      title='Modo'; climax='Shock';
  }
  const items = [cafe, booster, comida].filter(Boolean).map(c => PRODUCTS[c]);
  const mg = (PRODUCTS[cafe].mg || 0);
  return { items, title, climax, mg };
}

const STATE = { actividad:null, tiempo:null, peso:null, tolerancia:null, history:['home'] };
const stage = document.getElementById('stage');
const screens = stage.querySelectorAll('.screen');

function go(name, push=true) {
  screens.forEach(s => {
    const active = s.dataset.screen === name;
    s.classList.toggle('is-active', active);
    if (active) {
      s.querySelectorAll('.rise').forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
    }
  });
  if (push) STATE.history.push(name);
  resetIdle();
}
function back() {
  if (STATE.history.length <= 1) return;
  STATE.history.pop();
  go(STATE.history[STATE.history.length - 1], false);
}
function reset() {
  STATE.actividad = STATE.tiempo = STATE.peso = STATE.tolerancia = null;
  STATE.history = ['home'];
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('is-selected', 'is-tapped'));
  go('home', false);
}

document.querySelectorAll('[data-action]').forEach(b => {
  b.addEventListener('click', () => {
    b.classList.add('is-tapped');
    setTimeout(() => {
      const a = b.dataset.action;
      go(a === 'menu' ? 'menu' : 'actividad');
    }, 180);
  });
});

const order = ['actividad','tiempo','peso','tolerancia','result'];
document.querySelectorAll('[data-options]').forEach(group => {
  const key = group.dataset.options;
  group.querySelectorAll('.tile').forEach(opt => {
    opt.addEventListener('click', () => {
      group.querySelectorAll('.tile').forEach(t => t.classList.remove('is-selected'));
      opt.classList.add('is-selected');
      STATE[key] = opt.dataset.value;
      const cur = group.closest('.screen').dataset.screen;
      const nxt = order[order.indexOf(cur) + 1];
      setTimeout(() => {
        if (nxt === 'result') buildResult();
        go(nxt);
      }, 220);
    });
  });
});

document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', back));
document.querySelectorAll('[data-restart]').forEach(b => b.addEventListener('click', reset));
document.querySelectorAll('[data-confirm]').forEach(b => {
  b.addEventListener('click', () => { go('order'); startOrderCountdown(); });
});

function genCode() {
  const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  return letters[Math.floor(Math.random()*letters.length)] + (Math.floor(Math.random()*90)+10);
}
let LAST_CODE = null;
function buildResult() {
  const r = recommend(STATE);
  document.getElementById('resultTitle').textContent = `${r.title} ${r.climax}`;
  LAST_CODE = genCode();
  const oc = document.getElementById('orderCode');
  oc.textContent = LAST_CODE;
  oc.setAttribute('data-text', LAST_CODE);

  const wrap = document.getElementById('comboItems');
  wrap.innerHTML = '';
  let total = 0;
  r.items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'combo-item';
    row.innerHTML = `
      <span class="ci-code">${it.code}</span>
      <div style="min-width:0;">
        <div class="ci-name">${it.name}</div>
        <div class="ci-meta">${it.meta}</div>
      </div>
      <span class="ci-price">$ ${it.price.toLocaleString('es-AR')}</span>
    `;
    wrap.appendChild(row);
    total += it.price;
  });
  document.getElementById('comboTotal').textContent = '$ ' + total.toLocaleString('es-AR');
}

let orderTimer = null;
function startOrderCountdown() {
  let s = 10;
  document.getElementById('orderCountdown').textContent = s;
  clearInterval(orderTimer);
  orderTimer = setInterval(() => {
    s--;
    document.getElementById('orderCountdown').textContent = s;
    if (s <= 0) { clearInterval(orderTimer); reset(); }
  }, 1000);
}

let idleWarnTimer = null, idleTickTimer = null;
const IDLE_WARN_MS = 50_000;
const idleWarning = document.getElementById('idleWarning');
function resetIdle() {
  clearTimeout(idleWarnTimer);
  clearInterval(idleTickTimer);
  idleWarning.classList.remove('show');
  const cur = STATE.history[STATE.history.length - 1];
  if (cur === 'home' || cur === 'order') return;
  idleWarnTimer = setTimeout(() => {
    idleWarning.classList.add('show');
    let s = 10;
    document.getElementById('idleCount').textContent = s;
    idleTickTimer = setInterval(() => {
      s--;
      document.getElementById('idleCount').textContent = s;
      if (s <= 0) { clearInterval(idleTickTimer); idleWarning.classList.remove('show'); reset(); }
    }, 1000);
  }, IDLE_WARN_MS);
}
document.getElementById('idleStay').addEventListener('click', resetIdle);
['click','touchstart','keydown'].forEach(e => document.addEventListener(e, resetIdle, {passive:true}));

function tick() {
  const d = new Date();
  const pad = n => n.toString().padStart(2,'0');
  document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
tick(); setInterval(tick, 30_000);

/* PREVIEW MODE */
const PREVIEW_LABELS = {
  '9-16': '9 : 16  ·  KIOSK VERTICAL',
  '16-9': '16 : 9  ·  KIOSK HORIZONTAL',
  '9-19': '9 : 19.5  ·  MÓVIL',
  '3-4':  '3 : 4  ·  TABLET RETRATO',
};
function setPreview(mode) {
  document.querySelectorAll('.preview-tag').forEach(n => n.remove());
  if (!mode) { document.body.removeAttribute('data-preview'); return; }
  document.body.setAttribute('data-preview', mode);
  const tag = document.createElement('div');
  tag.className = 'preview-tag';
  tag.textContent = PREVIEW_LABELS[mode] + '  ·  R = reset';
  document.body.appendChild(tag);
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'Escape') back();
  if (e.key === 'v' || e.key === 'V') setPreview('9-16');
  if (e.key === 'h' || e.key === 'H') setPreview('16-9');
  if (e.key === 'm' || e.key === 'M') setPreview('9-19');
  if (e.key === 't' || e.key === 'T') setPreview('3-4');
  if (e.key === 'r' || e.key === 'R') setPreview(null);
});

/* =================================================================
   FIT TEXT (Range API · indiferente a qué tipografía cargue)
   ================================================================= */
function getTextWidth(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  return range.getBoundingClientRect().width;
}

function fitText(label, opts = {}) {
  const max = opts.max || 64;
  const min = opts.min || 12;
  const reservedRight = opts.reservedRight || 0;

  const parent = label.parentElement;
  if (!parent || !label.offsetParent) return;

  const parentStyle = getComputedStyle(parent);
  const padX = parseFloat(parentStyle.paddingLeft) + parseFloat(parentStyle.paddingRight);
  const available = parent.clientWidth - padX - reservedRight - 4;

  if (available <= 0) return;

  let lo = min, hi = max, best = min;
  while (lo <= hi) {
    const mid = Math.floor((lo + hi) / 2);
    label.style.fontSize = mid + 'px';
    if (getTextWidth(label) <= available) {
      best = mid;
      lo = mid + 1;
    } else {
      hi = mid - 1;
    }
  }
  label.style.fontSize = best + 'px';
}

function fitAllText() {
  document.querySelectorAll('.tile').forEach(tile => {
    const label = tile.querySelector('.tile-label');
    const arrow = tile.querySelector('.tile-arrow');
    if (!label) return;
    const arrowWidth = arrow ? arrow.offsetWidth : 0;
    const tileStyle = getComputedStyle(tile);
    const gap = parseFloat(tileStyle.gap) || 12;
    fitText(label, { max: 56, min: 10, reservedRight: arrowWidth + gap });
  });
  document.querySelectorAll('.home-tile').forEach(tile => {
    const label = tile.querySelector('.home-tile-label');
    if (!label) return;
    fitText(label, { max: 96, min: 20 });
  });
  document.querySelectorAll('.combo-item').forEach(row => {
    const name = row.querySelector('.ci-name');
    const price = row.querySelector('.ci-price');
    const code = row.querySelector('.ci-code');
    if (!name) return;
    const reserve = (price ? price.offsetWidth : 0)
                  + (code ? code.offsetWidth : 0)
                  + 80;
    fitText(name, { max: 44, min: 12, reservedRight: reserve });
  });
}

if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    fitAllText();
    setTimeout(fitAllText, 100);
  });
} else {
  window.addEventListener('load', fitAllText);
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fitAllText, 100);
});

const screenObserver = new MutationObserver(() => requestAnimationFrame(fitAllText));
document.querySelectorAll('.screen').forEach(s => {
  screenObserver.observe(s, { attributes: true, attributeFilter: ['class'] });
});

const _origBuildResult = buildResult;
buildResult = function() {
  _origBuildResult();
  requestAnimationFrame(fitAllText);
};

const _origSetPreview = setPreview;
setPreview = function(mode) {
  _origSetPreview(mode);
  setTimeout(fitAllText, 50);
};

setTimeout(fitAllText, 50);
setTimeout(fitAllText, 600);

resetIdle();
</script>
</body>
